<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Share test">
<title>Floor plan share test</title>
<!--
  Throwaway test page for #90: does a floor plan survive the Web Share API on iPhone?
  Standalone on purpose: no app code, no analytics, no account data. Delete once the test is done.
-->
<style>
  :root {
    --bg: #f6f7f6; --card: #ffffff; --fg: #18211d; --muted: #5d6b64; --line: #dde3df;
    --accent: #10b981; --accent-fg: #ffffff; --bad: #dc2626; --warn: #b45309;
    color-scheme: light;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0f1412; --card: #171e1b; --fg: #e8eeea; --muted: #94a39b; --line: #2a3530;
      --accent: #10b981; --accent-fg: #ffffff; --bad: #f87171; --warn: #fbbf24;
      color-scheme: dark;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--fg);
    font: 15px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    padding: max(16px, env(safe-area-inset-top)) max(16px, env(safe-area-inset-right))
             max(24px, env(safe-area-inset-bottom)) max(16px, env(safe-area-inset-left));
  }
  main { max-width: 640px; margin: 0 auto; display: flex; flex-direction: column; gap: 16px; }
  h1 { font-size: 1.3rem; margin: 0; text-wrap: balance; }
  h2 { font-size: 0.8rem; margin: 0 0 8px; text-transform: uppercase; letter-spacing: 0.06em; color: var(--muted); }
  p { margin: 0; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 14px; }
  .muted { color: var(--muted); font-size: 0.85rem; }
  pre { margin: 0; white-space: pre-wrap; word-break: break-word; font: 0.85rem/1.4 ui-monospace, Menlo, monospace; }
  .plan { display: flex; gap: 12px; align-items: center; }
  .plan img { width: 96px; height: 72px; object-fit: contain; background: #fff; border-radius: 6px; border: 1px solid var(--line); }
  .variants { display: flex; flex-direction: column; gap: 10px; }
  .variant { display: grid; grid-template-columns: 1fr auto; gap: 4px 12px; align-items: center; }
  .variant .label { font-weight: 600; }
  .variant .desc { grid-column: 1; color: var(--muted); font-size: 0.85rem; }
  .variant .result { grid-column: 1 / -1; font-size: 0.85rem; min-height: 1.2em; }
  button {
    font: inherit; font-weight: 600; border: 0; border-radius: 8px; padding: 9px 14px; cursor: pointer;
    background: var(--accent); color: var(--accent-fg);
  }
  button.secondary { background: transparent; color: var(--fg); border: 1px solid var(--line); }
  button:disabled { opacity: 0.45; cursor: default; }
  button:focus-visible, select:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .ok { color: var(--accent); } .bad { color: var(--bad); } .warn { color: var(--warn); }
  .grid-wrap { overflow-x: auto; }
  table { border-collapse: collapse; width: 100%; font-size: 0.85rem; }
  th, td { padding: 6px 4px; text-align: left; border-bottom: 1px solid var(--line); white-space: nowrap; }
  select { font: inherit; font-size: 0.8rem; background: var(--card); color: var(--fg); border: 1px solid var(--line); border-radius: 6px; padding: 3px; }
  .row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
</style>
</head>
<body>
<main>
  <header>
    <h1>Floor plan share test</h1>
    <p class="muted">For #90. Tap each variant, pick an app in the share menu, send it to yourself, and note what arrived in the table below.</p>
  </header>

  <section class="card">
    <h2>This device</h2>
    <pre id="env">Checking…</pre>
  </section>

  <section class="card">
    <h2>What gets shared</h2>
    <div class="plan">
      <img id="thumb" alt="Sample floor plan">
      <p class="muted" id="plan-status">Fetching the floor plan…</p>
    </div>
    <pre id="text" style="margin-top:12px"></pre>
  </section>

  <section class="card">
    <h2>Variants</h2>
    <div class="variants" id="variants"></div>
  </section>

  <section class="card">
    <h2>What arrived</h2>
    <div class="grid-wrap"><table id="grid"></table></div>
    <div class="row" style="margin-top:12px">
      <button class="secondary" id="copy">Copy results</button>
      <span class="muted" id="copied"></span>
    </div>
    <pre id="summary" class="muted" style="margin-top:8px" hidden></pre>
  </section>
</main>

<script>
  // A real, public floor plan from the Demo data, through the same image service the app uses
  const PLAN_URL = "https://wsrv.nl/?url=findbolig.nu/data/media/ef853a41-1b16-4e87-af8a-40d8ab0c8642/904acada-5f3b-4d73-a0cf-c0efd7b7a534.png&w=1600";
  const TEXT = [
    "Fremvisning: Mariendalsvej 52A, 1. MF, 2000 Frederiksberg",
    "Tirsdag 27. oktober 2026, 16:00–16:20",
    "13.564 kr./md · 3 værelser · 79 m²",
    "Kort: https://www.google.com/maps/search/?api=1&query=Mariendalsvej%2052A%2C%202000%20Frederiksberg",
  ].join("\n");
  const TITLE = "Plantegning: Mariendalsvej 52A";

  const VARIANTS = [
    { id: "v1", label: "1. Text and floor plan", desc: "One share with text and the image.", data: (f) => ({ text: TEXT, files: [f] }), needsFile: true },
    { id: "v2", label: "2. Floor plan only", desc: "One share with only the image.", data: (f) => ({ files: [f] }), needsFile: true },
    { id: "v3", label: "3. Floor plan with title", desc: "The image plus a title, no text.", data: (f) => ({ title: TITLE, files: [f] }), needsFile: true },
    { id: "v4", label: "4. Text only", desc: "Then tap 2 to send the floor plan as a second message.", data: () => ({ text: TEXT }), needsFile: false },
  ];
  const TARGETS = ["Messages", "WhatsApp", "Messenger", "Mail"];
  const OUTCOMES = ["–", "Text + image", "Image only", "Text only", "Nothing", "App not offered"];

  let planFile = null;
  const results = {};

  const $ = (id) => document.getElementById(id);
  const store = {
    get() { try { return JSON.parse(localStorage.getItem("share-test-grid") || "{}"); } catch { return {}; } },
    set(v) { try { localStorage.setItem("share-test-grid", JSON.stringify(v)); } catch {} },
  };

  function environment() {
    const standalone = navigator.standalone === true || matchMedia("(display-mode: standalone)").matches;
    const lines = [
      `Browser: ${navigator.userAgent}`,
      `Home-screen app: ${standalone ? "yes" : "no"}`,
      `Share menu: ${typeof navigator.share === "function" ? "yes" : "no"}`,
    ];
    if (planFile && navigator.canShare) {
      lines.push(`canShare text+image: ${navigator.canShare({ text: TEXT, files: [planFile] })}`);
      lines.push(`canShare image: ${navigator.canShare({ files: [planFile] })}`);
    }
    $("env").textContent = lines.join("\n");
  }

  function renderVariants() {
    const box = $("variants");
    for (const v of VARIANTS) {
      const el = document.createElement("div");
      el.className = "variant";
      el.innerHTML = `<span class="label"></span><button type="button" id="btn-${v.id}">Share</button><span class="desc"></span><span class="result" id="res-${v.id}"></span>`;
      el.querySelector(".label").textContent = v.label;
      el.querySelector(".desc").textContent = v.desc;
      box.append(el);
      // share() runs straight in the tap, with the file already fetched, so the tap still counts
      $(`btn-${v.id}`).addEventListener("click", () => share(v));
    }
    updateButtons();
  }

  function updateButtons() {
    for (const v of VARIANTS) $(`btn-${v.id}`).disabled = typeof navigator.share !== "function" || (v.needsFile && !planFile);
  }

  function show(v, cls, msg) {
    const el = $(`res-${v.id}`);
    el.className = `result ${cls}`;
    el.textContent = msg;
    results[v.id] = msg;
  }

  function share(v) {
    const data = v.data(planFile);
    if (navigator.canShare && !navigator.canShare(data)) {
      show(v, "bad", "canShare said no: the browser will not share this.");
      return;
    }
    navigator.share(data).then(
      () => show(v, "ok", "Share menu finished: the app accepted it. Note what actually arrived below."),
      (err) => {
        if (err.name === "AbortError") show(v, "warn", "Cancelled (AbortError).");
        else show(v, "bad", `Refused: ${err.name}: ${err.message}`);
      },
    );
  }

  function renderGrid() {
    const saved = store.get();
    const table = $("grid");
    const head = document.createElement("tr");
    head.innerHTML = "<th>Variant</th>" + TARGETS.map((t) => `<th>${t}</th>`).join("");
    table.append(head);
    for (const v of VARIANTS) {
      const tr = document.createElement("tr");
      const th = document.createElement("td");
      th.textContent = v.label.split(".")[0];
      tr.append(th);
      for (const t of TARGETS) {
        const td = document.createElement("td");
        const sel = document.createElement("select");
        sel.id = `cell-${v.id}-${t}`;
        sel.setAttribute("aria-label", `${v.label} into ${t}`);
        for (const o of OUTCOMES) sel.add(new Option(o, o));
        sel.value = saved[sel.id] ?? "–";
        sel.addEventListener("change", () => store.set({ ...store.get(), [sel.id]: sel.value }));
        td.append(sel);
        tr.append(td);
      }
      table.append(tr);
    }
  }

  function summary() {
    const lines = [$("env").textContent, ""];
    for (const v of VARIANTS) {
      lines.push(`${v.label}: ${results[v.id] ?? "not tried in this load"}`);
      lines.push("  " + TARGETS.map((t) => `${t}: ${$(`cell-${v.id}-${t}`).value}`).join(" | "));
    }
    return lines.join("\n");
  }

  $("copy").addEventListener("click", () => {
    const text = summary();
    const pre = $("summary");
    navigator.clipboard?.writeText(text).then(
      () => { $("copied").textContent = "Copied."; },
      () => { pre.hidden = false; pre.textContent = text; $("copied").textContent = "Copy failed; select the text below."; },
    ) ?? (pre.hidden = false, pre.textContent = text);
  });

  $("text").textContent = TEXT;
  renderVariants();
  renderGrid();
  environment();

  fetch(PLAN_URL)
    .then((r) => { if (!r.ok) throw new Error(`HTTP ${r.status}`); return r.blob(); })
    .then((blob) => {
      planFile = new File([blob], "plantegning-mariendalsvej-52a.png", { type: "image/png" });
      $("thumb").src = URL.createObjectURL(blob);
      $("plan-status").textContent = `Ready: ${planFile.name}, ${Math.round(blob.size / 1024)} KB.`;
      updateButtons();
      environment();
    })
    .catch((err) => {
      $("plan-status").textContent = `Could not fetch the floor plan (${err.message}). Variants 1–3 are off.`;
      $("plan-status").className = "bad";
    });
</script>
</body>
</html>
